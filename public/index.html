<style>
:root{
  --bg:#FFF6E8; --surface:#FFFFFF; --ink:#16213E; --muted:#5B6480;
  --saffron:#F2A71B; --tomato:#E0412F; --navy:#16213E; --line:#E8DCC6;
  --ok:#1E8A4C; --err:#C2271A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121A31; --surface:#1B2544; --ink:#FFF3E0; --muted:#B7BDD3; --line:#2C3860;
    --ok:#4CC27E; --err:#FF7A6B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A31; --surface:#1B2544; --ink:#FFF3E0; --muted:#B7BDD3; --line:#2C3860;
  --ok:#4CC27E; --err:#FF7A6B; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.45; -webkit-font-smoothing:antialiased;
}
main{max-width:460px; margin:0 auto; padding:28px 20px 40px; text-align:center}
.brand{font-weight:600; font-size:1rem; color:var(--muted); margin:0 0 18px}
h1{font-size:clamp(2rem,8vw,2.6rem); line-height:1.02; font-weight:800; letter-spacing:-.02em; margin:0 0 10px}
.lead{font-size:1.05rem; color:var(--muted); margin:0 auto 22px; max-width:32ch}

/* Wheel */
.wheel-wrap{position:relative; width:min(88vw,360px,max(200px,calc(100vh - 350px))); width:min(88vw,360px,max(200px,calc(100svh - 350px))); aspect-ratio:1; margin:34px auto 24px}
.wheel-wrap::before{ /* rim */
  content:""; position:absolute; inset:-10px; border-radius:50%;
  background:repeating-conic-gradient(var(--saffron) 0 7.5deg, var(--navy) 7.5deg 15deg);
}
#wheel{position:relative; width:100%; height:100%; border-radius:50%; display:block;
  transition:transform 5.2s cubic-bezier(.12,.72,.08,1); will-change:transform}
.pointer{position:absolute; top:-22px; left:50%; transform:translateX(-50%); width:38px; height:48px; z-index:2;
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.hub{position:absolute; inset:50% auto auto 50%; width:22%; aspect-ratio:1; transform:translate(-50%,-50%);
  border-radius:50%; background:var(--saffron); border:5px solid var(--navy); z-index:2;
  display:grid; place-items:center; font-weight:800; color:var(--navy); font-size:.85rem}

.btn{appearance:none; border:0; cursor:pointer; width:100%; max-width:340px; padding:17px 22px;
  border-radius:14px; font:inherit; font-weight:800; font-size:clamp(1rem,4.6vw,1.15rem); line-height:1.2; letter-spacing:.01em;
  background:var(--tomato); color:#fff; box-shadow:0 5px 0 #A52A1D; transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 #A52A1D}
.btn:disabled{opacity:.6; cursor:default}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--saffron); outline-offset:3px}
.btn.wa{background:#128C4A; box-shadow:0 5px 0 #0B6234}
.btn.wa:active{box-shadow:0 1px 0 #0B6234}

/* Sheet */
.sheet{display:none; text-align:left; background:var(--surface); border:2px solid var(--line);
  border-radius:20px; padding:22px 20px; margin-top:6px}
.sheet.show{display:block; animation:pop .35s ease-out}
.sheet{scroll-margin-top:calc(12px + env(safe-area-inset-top,0px))}
.phone input::placeholder{color:var(--muted); opacity:.45}
.wheel-wrap.can-spin{cursor:pointer}
@keyframes pop{from{transform:scale(.96); opacity:0}to{transform:none; opacity:1}}
.prize{display:block; font-size:1.9rem; font-weight:800; line-height:1.05; color:var(--tomato); margin:2px 0 6px}
.sheet p{margin:0 0 16px; color:var(--muted)}
label.field{display:block; font-weight:600; margin-bottom:8px}
.phone{display:flex; border:2px solid var(--line); border-radius:12px; overflow:hidden; background:var(--bg)}
.phone span{padding:14px 12px; font-weight:600; border-right:2px solid var(--line); color:var(--muted)}
.phone input{flex:1; min-width:0; border:0; background:transparent; color:var(--ink); font:inherit; font-size:1.15rem; padding:14px 12px}
.phone input:focus{outline:none}
.phone:focus-within{border-color:var(--saffron)}
.phone.bad{border-color:var(--err)}
.hint{min-height:1.3em; font-size:.9rem; margin:6px 0 12px; color:var(--err)}
.consent{display:flex; gap:10px; align-items:flex-start; font-size:.88rem; color:var(--muted); margin-bottom:18px}
.consent input{width:20px; height:20px; margin:1px 0 0; accent-color:var(--tomato); flex:none}
.sheet .btn{max-width:none}
.done{text-align:center}
.done .check{width:56px; height:56px; border-radius:50%; background:var(--ok); color:#fff; display:grid; place-items:center;
  font-size:1.8rem; margin:0 auto 12px}
.sheet .small{font-size:.85rem; color:var(--muted); margin:18px 0 0}
.hint:empty{margin-bottom:6px}
.consent-hint{margin:-8px 0 14px}

footer{max-width:460px; margin:0 auto; padding:0 20px 28px; text-align:center; font-size:.78rem; color:var(--muted)}
footer a{color:inherit}
.age{display:inline-block; border:2px solid currentColor; border-radius:50%; width:30px; height:30px; line-height:26px; font-weight:800; margin-bottom:6px}

/* Character */
.guru{display:flex; gap:12px; align-items:flex-start; text-align:left; margin:0 0 18px}
.guru > svg{flex:none; width:58px; height:58px; margin-top:2px}
.bubble{--bb:var(--surface); position:relative; flex:1; min-width:0; background:var(--bb); border:2px solid var(--line);
  border-radius:6px 16px 16px 16px; padding:9px 12px 10px; font-size:.97rem; line-height:1.36; color:var(--ink)}
.bubble::before,.bubble::after{content:""; position:absolute; top:12px; border-style:solid; border-width:8px 9px 8px 0; border-color:transparent}
.bubble::before{left:-10px; border-right-color:var(--line)}
.bubble::after{left:-7px; border-right-color:var(--bb)}
.bubble .who{display:block; font-size:.78rem; font-weight:800; color:var(--tomato); margin-bottom:1px}
.sheet .bubble{--bb:var(--bg)}
.sheet .guru{margin:6px 0 16px}
.bubble .msg{display:block}
.bubble.swap .msg{animation:swap .28s ease-out}
@keyframes swap{from{opacity:0; transform:translateY(3px)}to{opacity:1; transform:none}}
@media (max-width:360px){
  .guru{gap:9px}
  .guru > svg{width:44px; height:44px}
  .bubble{font-size:.92rem; padding:8px 10px 9px}
  .bubble::before,.bubble::after{top:9px}
}
@media (max-height:700px){
  main{padding-top:14px}
  .brand{margin-bottom:8px}
  h1{font-size:clamp(1.7rem,7.5vw,2.2rem)}
  .lead{font-size:.95rem; margin-bottom:10px}
  .guru{margin-bottom:10px}
  .wheel-wrap{width:min(88vw,292px); margin-bottom:18px}
}
@media (max-height:600px) and (orientation:portrait){
  .brand{display:none}
  main{padding-top:12px}
  h1{font-size:1.6rem; margin-bottom:8px}
  .wheel-wrap{width:min(80vw,236px); margin-bottom:16px}
  .btn{padding:14px 20px}
}
@media (orientation:landscape) and (max-height:520px){
  main{max-width:820px; display:grid; grid-template-columns:minmax(0,1fr) auto; column-gap:32px; align-items:center; text-align:left}
  main > *{grid-column:1}
  .wheel-wrap{grid-column:2; grid-row:1 / span 6; width:min(360px,calc(100vh - 70px)); width:min(360px,calc(100svh - 70px)); margin:24px 10px}
  .lead{margin-left:0}
  .brand{display:none}
  h1{font-size:1.55rem; margin-bottom:8px}
  .guru{margin-bottom:12px}
  .guru > svg{width:46px; height:46px}
  .bubble{font-size:.86rem; padding:7px 10px 8px}
  .sheet{padding:14px}
  .done .check{display:none}
  .prize{font-size:1.5rem}
  .sheet .small{margin-top:10px}
}
@media (max-width:360px){
  main{padding-left:14px; padding-right:14px}
  .btn{font-size:1.02rem; padding:16px 12px}
  .sheet{padding:18px 14px}
  .prize{font-size:1.6rem}
}
@media (max-width:300px){
  .btn{font-size:.94rem; padding:15px 10px}
}
@media (prefers-reduced-motion:reduce){
  #wheel{transition-duration:1.2s}
  .sheet.show,.bubble.swap .msg{animation:none}
}
</style>

<script>
(function(){
  const C = window.LP;
  const $ = id => document.getElementById(id);
  const cookie = n => (document.cookie.match("(?:^|; )" + n + "=([^;]*)") || [])[1] || "";
  const seg = 360 / C.segments.length;
  const colors = ["#E0412F","#16213E","#F2A71B","#16213E"];
  const textColors = ["#FFFFFF","#FFF3E0","#16213E","#FFF3E0"];

  /* ---- the character: drawn in SVG, three moods ---- */
  const guruSVG = mood => {
    const eyeR = mood === "wink"
      ? '<path d="M43 36.5Q47 33 51 36.5" fill="none" stroke="#2B1B17" stroke-width="2.4" stroke-linecap="round"/>'
      : '<ellipse cx="47" cy="36" rx="4.2" ry="4.6" fill="#fff"/><circle cx="47" cy="36.6" r="2.1" fill="#16213E"/>';
    const mouth = mood === "wow"
      ? '<ellipse cx="40" cy="55" rx="3.2" ry="3.6" fill="#7A2E22"/>'
      : '<path d="M34.5 53.5Q41 57 47 52.5" fill="none" stroke="#7A2E22" stroke-width="2.2" stroke-linecap="round"/>';
    const brows = mood === "wow"
      ? '<path d="M28.5 28.5Q33 25 37.5 28" fill="none" stroke="#2B1B17" stroke-width="3" stroke-linecap="round"/><path d="M42.5 28Q47 25 51.5 28.5" fill="none" stroke="#2B1B17" stroke-width="3" stroke-linecap="round"/>'
      : '<path d="M28.5 31Q33 28.5 37.5 30.5" fill="none" stroke="#2B1B17" stroke-width="3" stroke-linecap="round"/><path d="M42.5 29Q47.5 24.5 52 28" fill="none" stroke="#2B1B17" stroke-width="3" stroke-linecap="round"/>';
    return '<svg viewBox="0 0 80 80" aria-hidden="true" focusable="false">'
      + '<circle cx="40" cy="40" r="38" fill="#F2A71B"/>'
      + '<path d="M5.5 56H74.5A38 38 0 0 1 5.5 56Z" fill="#E0412F"/><path d="M13 65.5H67" stroke="#F2A71B" stroke-width="3.2" stroke-linecap="round"/><path d="M20 72H60" stroke="#FFF6E8" stroke-width="2.4" stroke-linecap="round"/>'
      + '<circle cx="22.5" cy="40" r="3.6" fill="#EDB48C" stroke="#16213E" stroke-width="2"/><circle cx="57.5" cy="40" r="3.6" fill="#EDB48C" stroke="#16213E" stroke-width="2"/>'
      + '<ellipse cx="40" cy="38.5" rx="17.5" ry="19.5" fill="#EDB48C" stroke="#16213E" stroke-width="2.4"/>'
      + '<path d="M22.5 34C21 14 59 14 57.5 34C53 25.5 27 25.5 22.5 34Z" fill="#2B1B17"/>'
      + '<rect x="25" y="15.5" width="13.5" height="8.5" rx="3.4" fill="#16213E"/><rect x="41.5" y="15.5" width="13.5" height="8.5" rx="3.4" fill="#16213E"/><path d="M38.5 19.5H41.5" stroke="#16213E" stroke-width="2"/><path d="M28 18.2H33" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".6"/><path d="M44.5 18.2H49.5" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>'
      + '<ellipse cx="33" cy="36" rx="4.2" ry="4.6" fill="#fff"/><circle cx="33" cy="36.6" r="2.1" fill="#16213E"/>' + eyeR + brows
      + '<path d="M40 38.5Q37.5 44 40.5 45" fill="none" stroke="#C98A60" stroke-width="1.8" stroke-linecap="round"/>'
      + '<path d="M29 50Q35 43.5 40 47Q45 43.5 51 50Q45.5 52 40 49.8Q34.5 52 29 50Z" fill="#2B1B17"/>' + mouth
      + '<circle cx="40" cy="40" r="38" fill="none" stroke="#16213E" stroke-width="3"/></svg>';
  };
  const fill = t => String(t).replace(/\{prize\}/g, C.segments[C.winIndex]).replace(/\{brand\}/g, C.brand);
  const L = C.guruLines;
  document.querySelectorAll("[data-face]").forEach(n => { n.outerHTML = guruSVG(n.getAttribute("data-face")); });
  document.querySelectorAll("[data-name]").forEach(n => { n.textContent = C.guruName; });
  const say = (id, text) => {
    const el = $(id), b = el.closest(".bubble");
    el.textContent = fill(text);
    b.classList.remove("swap"); void b.offsetWidth; b.classList.add("swap");
  };
  $("topMsg").textContent = fill(L.intro);
  $("claimMsg").textContent = fill(L.claim);
  $("doneMsg").textContent = fill(L.done);

  $("brandName").textContent = C.brand;
  $("brandName2").textContent = C.brand;
  $("prefix").textContent = C.countryPrefix;
  $("phone").placeholder = C.phonePlaceholder;
  const prize = C.segments[C.winIndex];
  $("prizeText").textContent = prize;
  $("prizeText2").textContent = prize;

  /* ---- tracking params from the ad / Keitaro ---- */
  const qs = new URLSearchParams(location.search);
  const track = {};
  ["subid","_subid","sub_id","clickid","fbclid","utm_source","utm_medium","utm_campaign","utm_content","utm_term"]
    .forEach(k => { if (qs.get(k)) track[k] = qs.get(k); });
  const subid = track.subid || track._subid || track.sub_id || track.clickid || "";

  /* ---- draw wheel ---- */
  const svg = $("wheel"), NS = "http://www.w3.org/2000/svg";
  const labels = [];
  const pt = (a, r) => [r*Math.cos((a-90)*Math.PI/180), r*Math.sin((a-90)*Math.PI/180)];
  C.segments.forEach((label, i) => {
    const a0 = i*seg, a1 = a0+seg, [x0,y0] = pt(a0,100), [x1,y1] = pt(a1,100);
    const p = document.createElementNS(NS,"path");
    p.setAttribute("d",`M0 0L${x0} ${y0}A100 100 0 0 1 ${x1} ${y1}Z`);
    p.setAttribute("fill", colors[i % colors.length]);
    p.setAttribute("stroke","#FFF6E8"); p.setAttribute("stroke-width","1.2");
    if (i === C.winIndex) p.id = "winSeg";
    svg.appendChild(p);
    const t = document.createElementNS(NS,"text");
    const mid = a0 + seg/2;
    t.setAttribute("transform",`rotate(${mid}) translate(0 -62) rotate(90)`);
    t.setAttribute("text-anchor","middle"); t.setAttribute("dominant-baseline","middle");
    t.setAttribute("fill", textColors[i % textColors.length]);
    t.setAttribute("font-size", "11");
    t.setAttribute("font-weight","800");
    t.setAttribute("font-family","Bricolage Grotesque, system-ui, sans-serif");
    t.textContent = label;
    svg.appendChild(t);
    labels.push(t);
  });
  // Shrink any label that would run into the hub or the rim (space from r=28 to r=94).
  const fitLabels = () => labels.forEach(t => {
    let fs = 11;
    t.setAttribute("font-size", fs);
    while (fs > 6.5 && t.getComputedTextLength() > 64) { fs -= .5; t.setAttribute("font-size", fs); }
  });
  fitLabels();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLabels);

  /* ---- remember returning visitors ---- */
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  };
  const showClaim = () => { $("spinBtn").style.display="none"; $("claim").classList.add("show"); $("claim").scrollIntoView({behavior:"smooth",block:"start"}); };
  const showDone  = () => { $("spinBtn").style.display="none"; $("claim").classList.remove("show"); $("done").classList.add("show"); $("done").scrollIntoView({behavior:"smooth",block:"start"}); };

  const markWinner = () => { const w = document.getElementById("winSeg"); if (w) { w.setAttribute("stroke","#FFFFFF"); w.setAttribute("stroke-width","4"); w.parentNode.insertBefore(w, w.parentNode.querySelector("text")); } };
  const finalAngle = 360*6 - (C.winIndex*seg + seg/2) + (Math.random()*seg*0.5 - seg*0.25);
  if (store.get("lp_lead")) { $("doneMsg").textContent = fill(L.back); svg.style.transition="none"; svg.style.transform=`rotate(${finalAngle}deg)`; markWinner(); showDone(); }
  else if (store.get("lp_spun")) { svg.style.transition="none"; svg.style.transform=`rotate(${finalAngle}deg)`; markWinner(); showClaim(); }

  /* ---- spin (button, wheel or hub) ---- */
  const wrap = document.querySelector(".wheel-wrap");
  let spun = !!(store.get("lp_spun") || store.get("lp_lead"));
  if (!spun) wrap.classList.add("can-spin");
  let impatient = 0;
  wrap.addEventListener("click", () => {
    if (!spun) { $("spinBtn").click(); return; }
    if (!$("claim").classList.contains("show") && !$("done").classList.contains("show")) {
      say("topMsg", L.impatient[Math.min(impatient++, L.impatient.length - 1)]);
    }
  });
  $("spinBtn").addEventListener("click", () => {
    if (spun) return;
    spun = true; wrap.classList.remove("can-spin");
    $("spinBtn").disabled = true;
    say("topMsg", L.spinning);
    svg.style.transform = `rotate(${finalAngle}deg)`;
    svg.addEventListener("transitionend", () => {
      store.set("lp_spun","1");
      markWinner();
      say("topMsg", L.won);
      if (window.fbq) fbq("trackCustom","WheelSpin");
      setTimeout(showClaim, 350);
    }, {once:true});
  });

  /* ---- phone input ---- */
  const phone = $("phone");
  phone.addEventListener("input", () => {
    phone.value = phone.value.replace(/[^\d ]/g,"");
    $("phoneBox").classList.remove("bad"); $("hint").textContent = "";
  });
  $("consent").addEventListener("change", () => { $("consentHint").textContent = ""; });

  /* ---- claim ---- */
  $("claimBtn").addEventListener("click", async () => {
    const digits = phone.value.replace(/\D/g,"").replace(/^34/,"");
    if (!C.phonePattern.test(digits)) {
      $("phoneBox").classList.add("bad");
      $("hint").textContent = digits.length === 0
        ? "Escribe tu número de WhatsApp."
        : L.badPhone;
      phone.focus(); return;
    }
    if (!$("consent").checked) {
      $("consentHint").textContent = L.noConsent;
      return;
    }
    $("claimBtn").disabled = true; $("claimBtn").textContent = "Reservando…";

    const eventId = "lead_" + Date.now() + "_" + Math.random().toString(36).slice(2,8);
    const lead = {
      phone: C.countryPrefix + digits,
      prize, brand: C.brand, consent: true,
      event_id: eventId, subid, ...track,
      fbp: cookie("_fbp"), fbc: cookie("_fbc") || (track.fbclid ? "fb.1." + Date.now() + "." + track.fbclid : ""),
      page: location.href.split("?")[0], landing_url: location.href, referrer: document.referrer,
      ts: new Date().toISOString()
    };

    if (C.webhookUrl) {
      const ctrl = window.AbortController ? new AbortController() : null;
      const timer = ctrl && setTimeout(() => ctrl.abort(), 8000);
      try {
        const r = await fetch(C.webhookUrl, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify(lead), keepalive:true, signal: ctrl && ctrl.signal
        });
        if (r.status === 400) {
          // The server rejected the number: let the visitor fix it instead of losing the lead.
          $("phoneBox").classList.add("bad");
          $("hint").textContent = L.badPhone;
          $("claimBtn").disabled = false; $("claimBtn").textContent = "Reservar mi premio";
          phone.focus(); return;
        }
      } catch(e) { console.warn("Lead request failed", e); }
      finally { if (timer) clearTimeout(timer); }
    }
    if (window.fbq) fbq("track","Lead",{content_name:prize},{eventID:eventId});

    store.set("lp_lead","1");
    showDone();
  });

  /* ---- WhatsApp channel ---- */
  $("channelBtn").addEventListener("click", () => {
    if (window.fbq) fbq("trackCustom","ChannelClick");
    window.location.href = C.channelUrl;
  });
})();
</script>
</body>
</html>
